spring.application.name=university-registry

# the real credentials stay in the git-ignored db.properties you already have
spring.config.import=classpath:db.properties
spring.datasource.url=${db.url}
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}

# Hibernate only CHECKS that the mapping matches our tables, never changes them
spring.jpa.hibernate.ddl-auto=validate
# print the SQL Hibernate generates (development only)
spring.jpa.show-sql=true